# Include inside the existing HTTPS server block; leave other site routes intact.
location = /flyfear { return 308 /flyfear/; }
location = /flyfear/ws {
    access_log off;
    error_log /var/log/nginx/flyfear-error.log crit;
    proxy_pass http://127.0.0.1:8765/ws;
    # Fixed websocket upgrade below excludes h2c; the generic rule matches all upgrade values.
    # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
    proxy_http_version 1.1;
    proxy_set_header Upgrade websocket;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_read_timeout 120s;
    proxy_send_timeout 15s;
    proxy_buffering off;
}
location = /flyfear/health {
    access_log off;
    proxy_pass http://127.0.0.1:8765/health;
    proxy_http_version 1.1;
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    add_header Cache-Control "no-store" always;
}
location ^~ /flyfear/ {
    alias /opt/flyfear/public/;
    index index.html;
    types {
        text/html html;
        application/javascript js;
        application/wasm wasm;
        image/png png;
        application/octet-stream pck;
    }
    autoindex off;
    access_log off;
    error_log /var/log/nginx/flyfear-error.log crit;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-cache" always;
    gzip on;
    gzip_static on;
    gzip_types application/wasm application/octet-stream application/javascript;
}
